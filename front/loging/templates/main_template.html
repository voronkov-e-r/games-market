<!doctype html>
<html lang="ru">

<head>
    <title>
    {% block title %}{% endblock %}
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
      animation: float 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 255, 200, 0.1) 0%, transparent 70%);
      bottom: -80px;
      left: -80px;
      border-radius: 50%;
      animation: float 15s ease-in-out infinite alternate-reverse;
      pointer-events: none;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(40px, 30px) scale(1.2);
      }
    }

    .particles {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: rise linear infinite;
    }

    .particle:nth-child(1) { left: 10%; animation-duration: 14s; animation-delay: 0s; width: 3px; height: 3px; }
    .particle:nth-child(2) { left: 20%; animation-duration: 18s; animation-delay: 2s; width: 5px; height: 5px; opacity: 0.2; }
    .particle:nth-child(3) { left: 35%; animation-duration: 12s; animation-delay: 4s; width: 4px; height: 4px; }
    .particle:nth-child(4) { left: 50%; animation-duration: 20s; animation-delay: 1s; width: 6px; height: 6px; opacity: 0.15; }
    .particle:nth-child(5) { left: 65%; animation-duration: 16s; animation-delay: 3s; width: 3px; height: 3px; }
    .particle:nth-child(6) { left: 75%; animation-duration: 22s; animation-delay: 5s; width: 5px; height: 5px; opacity: 0.2; }
    .particle:nth-child(7) { left: 85%; animation-duration: 13s; animation-delay: 2.5s; width: 4px; height: 4px; }
    .particle:nth-child(8) { left: 45%; animation-duration: 19s; animation-delay: 0.5s; width: 7px; height: 7px; opacity: 0.1; }
    .particle:nth-child(9) { left: 5%; animation-duration: 17s; animation-delay: 3.5s; width: 3px; height: 3px; }
    .particle:nth-child(10) { left: 55%; animation-duration: 15s; animation-delay: 4.5s; width: 5px; height: 5px; opacity: 0.15; }
    .particle:nth-child(11) { left: 92%; animation-duration: 21s; animation-delay: 1.5s; width: 4px; height: 4px; }
    .particle:nth-child(12) { left: 30%; animation-duration: 16s; animation-delay: 3s; width: 6px; height: 6px; opacity: 0.1; }
    .particle:nth-child(13) { left: 70%; animation-duration: 14s; animation-delay: 2s; width: 3px; height: 3px; }
    .particle:nth-child(14) { left: 15%; animation-duration: 23s; animation-delay: 4s; width: 5px; height: 5px; opacity: 0.2; }
    .particle:nth-child(15) { left: 80%; animation-duration: 18s; animation-delay: 0.8s; width: 4px; height: 4px; }

    @keyframes rise {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    .glow-ring {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(100, 200, 255, 0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.5;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: 0.1;
      }
    }

    .gradient-overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(120, 80, 200, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 200, 180, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 150, 50, 0.08) 0%, transparent 50%);
      pointer-events: none;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 2;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.05em;
      user-select: none;
      padding: 2rem;
    }

    .content h1 {
      font-size: 3.5rem;
      font-weight: 200;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(200, 220, 255, 0.5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 80px rgba(100, 150, 255, 0.1);
      margin-bottom: 0.5rem;
    }

    .content p {
      font-size: 1.1rem;
      opacity: 0.4;
      font-weight: 300;
      letter-spacing: 0.2em;
    }

    #root {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
    }

    @media (max-width: 600px) {
      .content h1 {
        font-size: 2.2rem;
      }
      .content p {
        font-size: 0.9rem;
      }
    }
    </style>
</head>

<body>
    <div id="root">
      {% block content %}{% endblock %}
    </div>
    <div class="gradient-overlay"></div>
    <div class="glow-ring"></div>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
</body>

</html>
