{% extends 'main_template.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="register-wrapper">
  <div class="register-card">
    <div class="register-header">
      <h2>Создать аккаунт</h2>
      <p>Присоединяйтесь к сообществу</p>
    </div>

    <form class="register-form" action="" method="POST">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" placeholder="Введите имя" required>
      </div>

      <div class="form-group">
        <label for="email">Электронная почта</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Минимум 8 символов" required>
      </div>

      <div class="form-group">
        <label for="confirm">Подтверждение пароля</label>
        <input type="password" id="confirm" name="confirm" placeholder="Повторите пароль" required>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" name="agree" required>
          <span>Я согласен с условиями использования</span>
        </label>
      </div>

      <button type="submit" class="register-btn">Зарегистрироваться</button>

      <div class="register-footer">
        <p>Уже есть аккаунт? <a href="/">Войти</a></p>
      </div>
    </form>
  </div>
</div>

<style>
  .register-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    padding: 1.5rem;
  }

  .register-card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 2.5rem;
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 440px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    transition: all 0.3s ease;
  }

  .register-card:hover {
    border-color: rgba(255, 255, 255, 0.15);
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
  }

  .register-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .register-header h2 {
    color: rgba(255, 255, 255, 0.95);
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.3rem;
  }

  .register-header p {
    color: rgba(255, 255, 255, 0.5);
    font-size: 1rem;
    font-weight: 300;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 0.4rem;
    letter-spacing: 0.02em;
  }

  .form-group input {
    width: 100%;
    padding: 0.8rem 1.2rem;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 1.2rem;
    color: rgba(255, 255, 255, 0.9);
    font-size: 1rem;
    transition: all 0.3s ease;
    outline: none;
    font-family: inherit;
  }

  .form-group input::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }

  .form-group input:focus {
    border-color: rgba(100, 200, 255, 0.4);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 20px rgba(100, 200, 255, 0.05);
  }

  .form-group input:focus-visible {
    outline: none;
  }

  .form-options {
    margin: 1.8rem 0 2rem;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.9rem;
    cursor: pointer;
  }

  .checkbox-label input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #6c5ce7;
    cursor: pointer;
    flex-shrink: 0;
  }

  .checkbox-label span {
    user-select: none;
  }

  .register-btn {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    border: none;
    border-radius: 1.5rem;
    color: white;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.02em;
    font-family: inherit;
  }

  .register-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3);
    background: linear-gradient(135deg, #7c6df0, #b0a9ff);
  }

  .register-btn:active {
    transform: translateY(0);
  }

  .register-footer {
    text-align: center;
    margin-top: 2rem;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.95rem;
  }

  .register-footer a {
    color: #a29bfe;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
  }

  .register-footer a:hover {
    color: #c8c0ff;
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .register-card {
      padding: 2rem 1.5rem;
      border-radius: 2rem;
    }

    .register-header h2 {
      font-size: 1.7rem;
    }

    .form-group input {
      padding: 0.7rem 1rem;
    }
  }
</style>
{% endblock %}
